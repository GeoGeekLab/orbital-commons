name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build self-contained site
        shell: bash
        run: bash scripts/build-site.sh
      - name: Static contract checks
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/runtime/orbital/orbital-engine.js
          test -s _site/runtime/orbital/orbit-worker.js
          test -s _site/runtime/orbital/orbital-lab.css
          test -s _site/runtime/vendor/three.module.js
          test -s _site/runtime/vendor/satellite.esm.js
          test -s _site/runtime-manifest.sha256
          grep -q 'PRODUCTION RUNTIME / VENDORED' _site/index.html
          ! grep -R -q 'cdn.jsdelivr.net/gh/GeoGeekLab/GeoGeekLab.github.io' _site
          ! grep -R -q 'cdn.jsdelivr.net/npm' _site/runtime/orbital
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
